<meta charset="utf-8">
<title>Broker Agent Replay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: a claims desk. The docket of cases runs down the left; the open case file on the right lays the
   agent's drafted step beside the broker's real one, then the history the agent saw and its reasoning. */
:root {
  --bg: #eceff1; --surface: #f8f9fa; --raised: #ffffff; --ink: #17222c; --muted: #5a6772; --line: #d2d9de;
  --accent: #0e5a7e;
  --act: #1b62a8; --ask: #8f5a00; --esc: #ad2f3b; --none: #55626d;
  --ok: #1a7550; --warn: #955600; --crit: #b3261e;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1418; --surface: #161d23; --raised: #1c252d; --ink: #e4e9ed; --muted: #94a1ac; --line: #2c3842;
    --accent: #7cc0e3;
    --act: #7ab4ef; --ask: #e0a84a; --esc: #f08c95; --none: #9ca9b4;
    --ok: #62c796; --warn: #e0a84a; --crit: #f28b82;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1418; --surface: #161d23; --raised: #1c252d; --ink: #e4e9ed; --muted: #94a1ac; --line: #2c3842;
  --accent: #7cc0e3;
  --act: #7ab4ef; --ask: #e0a84a; --esc: #f08c95; --none: #9ca9b4;
  --ok: #62c796; --warn: #e0a84a; --crit: #f28b82;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--sans); }
h1, h2, h3, h4, p, dl, dd, ol, ul { margin: 0; }
ol, ul { padding: 0; list-style: none; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1400px; margin-inline: auto; padding-inline: clamp(16px, 3vw, 32px); padding-block: 28px 56px;
  display: flex; flex-direction: column; gap: 24px; }
.eyebrow { font: 500 12px/1.3 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* masthead */
.top { display: flex; flex-wrap: wrap; gap: 16px 40px; align-items: flex-end; justify-content: space-between; }
.top > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 420px; }
h1 { font: 600 28px/1.15 var(--sans); letter-spacing: -.01em; text-wrap: balance; }
.lede { color: var(--muted); max-width: 68ch; }
.runmeta { display: grid; grid-template-columns: auto auto; gap: 2px 14px; font-size: 13px; }
.runmeta dt { color: var(--muted); }
.runmeta dd { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* run summary */
.summary { display: flex; flex-direction: column; gap: 14px; padding: 16px 18px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; }
.mix { display: flex; height: 14px; gap: 2px; border-radius: 3px; overflow: hidden; }
.mix span { background: var(--c); min-width: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13px; }
.legend li { display: flex; align-items: center; gap: 7px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; background: var(--c); }
.legend b { font: 500 13px var(--mono); font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px 24px;
  padding-top: 14px; border-top: 1px solid var(--line); }
.stats dt { font-size: 12.5px; color: var(--muted); }
.stats dd { font: 500 20px/1.25 var(--mono); font-variant-numeric: tabular-nums; }
.stats dd small { font: 400 12.5px var(--sans); color: var(--muted); }
[data-d="act"] { --c: var(--act); } [data-d="ask_for_info"] { --c: var(--ask); }
[data-d="escalate"] { --c: var(--esc); } [data-d="no_action"] { --c: var(--none); } [data-d="failed"] { --c: var(--crit); }

/* desk */
.desk { display: grid; grid-template-columns: minmax(260px, 330px) minmax(0, 1fr); gap: 24px; align-items: start; }
.docket { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px);
  display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.search { width: 100%; padding: 8px 10px; background: var(--raised); border: 1px solid var(--line); border-radius: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 3px 9px; font-size: 12.5px; background: transparent; border: 1px solid var(--line); border-radius: 999px;
  cursor: pointer; color: var(--muted); }
.chip:hover { color: var(--ink); border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.count { font-size: 12.5px; color: var(--muted); }
.list { overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; min-height: 120px; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 1px 10px; align-items: baseline; width: 100%;
  padding: 9px 12px; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.row:last-child { border-bottom: 0; }
.row:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.row[aria-current="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.row[aria-current="true"] .rid { color: var(--accent); font-weight: 500; }
.rid { font: 400 13px var(--mono); color: var(--muted); }
.rtitle { font-weight: 500; font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; }
.rmeta { grid-column: 2 / 4; font-size: 12.5px; color: var(--muted); }
.rmeta .diff { color: var(--warn); }
.empty { padding: 18px 14px; color: var(--muted); font-size: 14px; }
.pill { display: inline-block; padding: 1px 8px; font: 500 11.5px/1.6 var(--sans); letter-spacing: .04em; text-transform: uppercase;
  white-space: nowrap; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
  background: color-mix(in srgb, var(--c) 10%, transparent); border-radius: 3px; }

/* case file */
.file { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.fhead { display: flex; flex-direction: column; gap: 8px; }
h2 { font: 600 22px/1.2 var(--sans); text-wrap: balance; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 28px; font-size: 13.5px; }
.facts div { display: flex; gap: 6px; min-width: 0; }
.facts dt { color: var(--muted); }
.cutline { font-size: 13.5px; color: var(--muted); }
.cutline b { color: var(--ink); font-weight: 500; }
.compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; padding-top: 12px; border-top: 2px solid var(--ink); }
.col.agent { border-top-color: var(--accent); }
h3 { font: 600 13px/1.3 var(--sans); letter-spacing: .07em; text-transform: uppercase; }
.col.agent h3 { color: var(--accent); }
.verdict { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 13.5px; }
.verdict .conf { font-family: var(--mono); color: var(--muted); }
.same { font-size: 12.5px; font-weight: 500; }
.same[data-same="true"] { color: var(--ok); } .same[data-same="false"] { color: var(--warn); }
.situation { color: var(--muted); font-size: 14px; max-width: 70ch; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* one piece of correspondence: an agent draft, a broker email, a note, an escalation */
.letter { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; background: var(--raised);
  border: 1px solid var(--line); border-radius: 3px; min-width: 0; }
.letter.withdrawn { opacity: .7; border-style: dashed; }
.lhead { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; font-size: 13px; }
.lhead .chan { font: 500 11.5px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.lhead .who { overflow-wrap: anywhere; min-width: 0; }
.lhead .who span { color: var(--muted); }
.lhead .ts { font: 400 12px var(--mono); color: var(--muted); margin-left: auto; }
.stamp { padding: 0 6px; font: 500 11px/1.7 var(--mono); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap;
  border: 1px solid currentColor; border-radius: 2px; }
.stamp.hold { color: var(--warn); } .stamp.go { color: var(--ok); } .stamp.urgent { color: var(--crit); } .stamp.plain { color: var(--muted); }
.subject { font-weight: 500; font-size: 14px; }
.body { font: 400 15px/1.6 var(--serif); white-space: pre-wrap; overflow-wrap: anywhere; max-width: 66ch; }
.lfoot { font-size: 13px; color: var(--muted); padding-top: 8px; border-top: 1px dashed var(--line); }
.lfoot b { font-weight: 500; color: var(--ink); }
.sub { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.sub h4 { font: 500 12.5px var(--sans); color: var(--muted); }
.bul { display: flex; flex-direction: column; gap: 4px; padding-left: 18px; list-style: disc; font-size: 14px; }
.bul li { overflow-wrap: anywhere; }
details { min-width: 0; }
summary { cursor: pointer; font-size: 13.5px; color: var(--muted); padding: 2px 0; }
summary:hover { color: var(--ink); }
details[open] > summary { margin-bottom: 10px; }

/* history the agent saw */
.block { display: flex; flex-direction: column; gap: 12px; min-width: 0; padding-top: 12px; border-top: 1px solid var(--line); }
.timeline { display: flex; flex-direction: column; gap: 10px; }
.timeline > li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.timeline .num { font: 400 13px var(--mono); color: var(--muted); padding-top: 15px; text-align: right; }
.atts { display: flex; flex-wrap: wrap; gap: 12px; }
.att { display: flex; flex-direction: column; gap: 6px; max-width: 100%; font-size: 13px; }
.att img { max-width: min(100%, 380px); border: 1px solid var(--line); border-radius: 3px; background: #fff; }
.att .mono { color: var(--muted); }
.reason { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 28px; }
.reason .wide { grid-column: 1 / -1; }
.reason p { font-size: 14px; max-width: 80ch; }
.fail { padding: 12px 14px; border: 1px solid var(--crit); border-radius: 3px; color: var(--crit); font-size: 14px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { padding: 6px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
th { font-weight: 500; color: var(--muted); white-space: nowrap; }
td { font-family: var(--mono); overflow-wrap: anywhere; min-width: 90px; }
td.err { color: var(--crit); }
.foot { font-size: 13px; color: var(--muted); max-width: 90ch; }

@media (max-width: 1120px) { .compare, .reason { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 860px) {
  .desk { grid-template-columns: minmax(0, 1fr); }
  .docket { position: static; max-height: none; }
  .list { max-height: 300px; }
  .lhead .ts { margin-left: 0; }
}
@media (prefers-reduced-motion: no-preference) { .row, .chip { transition: background-color .12s, color .12s; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow" id="track"></p>
      <h1>Broker Agent Replay</h1>
      <p class="lede" id="lede"></p>
    </div>
    <dl class="runmeta" id="runmeta"></dl>
  </header>

  <section class="summary" aria-label="Run summary">
    <div class="mix" id="mix" role="img"></div>
    <ul class="legend" id="legend"></ul>
    <dl class="stats" id="stats"></dl>
  </section>

  <div class="desk">
    <aside class="docket" aria-label="Cases">
      <input class="search" id="q" type="search" placeholder="Search case, broker, property" aria-label="Search cases">
      <div class="chips" id="chips"></div>
      <p class="count" id="count"></p>
      <div class="list" id="list"></div>
    </aside>
    <article class="file" id="file" aria-live="polite"></article>
  </div>

  <p class="foot" id="foot"></p>
</div>

<script type="application/json" id="data">/*__DATA__*/</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const CASES = DATA.cases, RUN = DATA.run || {};
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const DEC = ['act', 'ask_for_info', 'escalate', 'no_action', 'failed'];
  const DLABEL = { act: 'Act', ask_for_info: 'Ask for info', escalate: 'Escalate', no_action: 'No action', failed: 'Did not finish' };
  const ROLE = { customer: 'customer', insurer: 'insurer', third_party: 'third party', contractor: 'contractor', internal: 'colleague',
    other: 'other party', note: 'case note', escalation: 'human handler', none: 'nobody' };
  const GOLD = { customer: 'the customer', insurer: 'the insurer', note: 'the case file (internal note)', internal: 'a colleague', other: 'another party' };
  const CHAN = { email: 'Email', phone_call: 'Call', sms: 'SMS', portal: 'Portal', protected_claim_channel: 'Claim channel', letter: 'Letter' };
  const pad = n => String(n).padStart(2, '0');
  const state = { q: '', d: 'all', diff: false, issues: false, sel: null };

  const committed = c => c.agent.actions.filter(a => a.status === 'committed');
  const messages = c => committed(c).filter(a => a.tool === 'send_message');

  /* ---------- masthead and summary ---------- */
  const n = CASES.length, withGold = CASES.filter(c => c.cut != null);
  $('track').textContent = (RUN.track || 'Cases') + ' · public example cases';
  $('lede').textContent = withGold.length
    ? `The agent picked up each of ${n} cases just before the broker's last recorded step, with every later event and the recorded outcome hidden. Its decision sits beside what the broker actually did next.`
    : `The agent decided the next step for each of ${n} cases from the full case file.`;
  const totalCost = CASES.reduce((s, c) => s + (+c.agent.cost || 0), 0);
  const meta = [['Model', RUN.model || '—'], ['Finished', (RUN.finished_at || '').replace('T', ' ').replace('+00:00', ' UTC') || '—'],
    ['Wall time', RUN.wall_s ? Math.round(RUN.wall_s) + ' s' : '—'], ['Est. cost', '$' + totalCost.toFixed(2)]];
  $('runmeta').innerHTML = meta.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');

  const byDec = Object.fromEntries(DEC.map(d => [d, CASES.filter(c => c.agent.decision === d).length]));
  const shown = DEC.filter(d => byDec[d]);
  $('mix').innerHTML = shown.map(d => `<span data-d="${d}" style="flex:${byDec[d]} 1 0" title="${esc(DLABEL[d])}: ${byDec[d]}"></span>`).join('');
  $('mix').setAttribute('aria-label', 'Decision mix: ' + shown.map(d => `${DLABEL[d]} ${byDec[d]}`).join(', '));
  $('legend').innerHTML = shown.map(d => `<li data-d="${d}"><i></i>${esc(DLABEL[d])} <b>${byDec[d]}</b></li>`).join('');
  const msgs = CASES.flatMap(messages), held = msgs.filter(a => a.input.needs_human_approval).length;
  const same = withGold.filter(c => c.same === true).length, judged = withGold.filter(c => c.same != null).length;
  const flagged = CASES.filter(c => (c.agent.issues || []).length).length;
  const avg = n ? CASES.reduce((s, c) => s + (+c.agent.duration || 0), 0) / n : 0;
  const stats = [['Finished cleanly', `${n - byDec.failed}<small> of ${n}</small>`]];
  if (judged) stats.push(['Same addressee as the broker', `${same}<small> of ${judged}</small>`]);
  stats.push(['Messages drafted', `${msgs.length}<small> · ${held} held for approval</small>`],
    ['Cases with issues flagged', `${flagged}<small> of ${n}</small>`],
    ['Per case', `${avg.toFixed(0)} s<small> · $${(n ? totalCost / n : 0).toFixed(3)}</small>`]);
  $('stats').innerHTML = stats.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${v}</dd></div>`).join('');
  $('foot').textContent = judged
    ? '"Same addressee" is a coarse automatic check: it only says the agent addressed the same party (customer, insurer, or the internal file) as the broker did at that point. It does not compare what was said. Read the two columns to judge the content.'
    : '';

  /* ---------- docket ---------- */
  function visible(c) {
    if (state.d !== 'all' && c.agent.decision !== state.d) return false;
    if (state.diff && c.same !== false) return false;
    if (state.issues && !(c.agent.issues || []).length) return false;
    if (state.q) {
      const hay = [c.id, c.title, c.cat, c.details.Broker, c.details.Insurer, c.details.Property, c.customer].join(' ').toLowerCase();
      if (!hay.includes(state.q)) return false;
    }
    return true;
  }
  function chip(key, val, label) {
    const on = key === 'd' ? state.d === val : state[key];
    return `<button class="chip" type="button" data-k="${key}" data-v="${esc(val)}" aria-pressed="${on}">${esc(label)}</button>`;
  }
  function renderChips() {
    let h = chip('d', 'all', 'All') + shown.map(d => chip('d', d, `${DLABEL[d]} ${byDec[d]}`)).join('');
    if (judged) h += chip('diff', '', `Different addressee ${judged - same}`);
    h += chip('issues', '', `Issues flagged ${flagged}`);
    $('chips').innerHTML = h;
  }
  function renderList() {
    const rows = CASES.filter(visible);
    $('count').textContent = rows.length === n ? `${n} cases` : `${rows.length} of ${n} cases`;
    $('list').innerHTML = rows.length ? rows.map(c => {
      const a = c.agent, to = a.roles.filter(r => r !== 'note').map(r => ROLE[r] || r).join(', ');
      const bits = [c.cat, a.confidence != null ? 'conf ' + (+a.confidence).toFixed(2) : '', to ? '→ ' + to : ''].filter(Boolean).map(esc);
      if (c.same === false) bits.push('<span class="diff">different addressee</span>');
      return `<button class="row" type="button" data-id="${esc(c.id)}" aria-current="${c.id === state.sel}">
        <span class="rid">${esc(c.id)}</span><span class="rtitle">${esc(c.title)}</span>
        <span class="pill" data-d="${esc(a.decision)}">${esc(DLABEL[a.decision] || a.decision)}</span>
        <span class="rmeta">${bits.join(' · ')}</span></button>`;
    }).join('') : '<p class="empty">No case matches these filters.</p>';
  }

  /* ---------- case file ---------- */
  const bullets = (items, empty) => (items && items.length)
    ? `<ul class="bul">${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>` : `<p class="situation">${esc(empty)}</p>`;
  function eventLetter(e) {
    return `<article class="letter"><div class="lhead"><span class="chan">${esc(e.ch)}</span>
      <span class="who">${esc(e.from)}${e.to ? ` <span>to</span> ${esc(e.to)}` : ''}</span><span class="ts">${esc(e.ts)}</span></div>
      <div class="body">${esc(e.body)}</div></article>`;
  }
  function actionLetter(a) {
    const i = a.input, off = a.status === 'cancelled';
    const cls = 'letter' + (off ? ' withdrawn' : '');
    const tail = off ? `<p class="lfoot"><b>Withdrawn after self-check:</b> ${esc(a.cancel_reason)}</p>` : '';
    if (a.tool === 'send_message') {
      const stamp = i.needs_human_approval ? '<span class="stamp hold">Held for approval</span>' : '<span class="stamp go">Sends unreviewed</span>';
      return `<article class="${cls}"><div class="lhead"><span class="chan">${esc(CHAN[i.channel] || i.channel)}</span>
        <span class="who"><span>to</span> ${esc(i.to)} <span>(${esc(ROLE[i.recipient_role] || i.recipient_role)})</span></span>${stamp}</div>
        ${i.subject ? `<p class="subject">${esc(i.subject)}</p>` : ''}<div class="body">${esc(i.body)}</div>
        ${i.purpose ? `<p class="lfoot"><b>Why now:</b> ${esc(i.purpose)}</p>` : ''}${tail}</article>`;
    }
    if (a.tool === 'escalate_to_human') {
      const urgent = i.urgency === 'high' || i.urgency === 'critical';
      return `<article class="${cls}"><div class="lhead"><span class="chan">Escalation</span>
        <span class="who"><span>to</span> ${esc(i.route_to || 'human handler')}</span><span class="stamp ${urgent ? 'urgent' : 'plain'}">Urgency ${esc(i.urgency)}</span></div>
        <p class="subject">${esc(i.reason)}</p><div class="body">${esc(i.handover_summary)}</div>
        <div class="sub"><h4>Open questions</h4>${bullets(i.open_questions, 'None listed.')}</div>
        ${(i.recommended_next_steps || []).length ? `<div class="sub"><h4>Recommended next steps</h4>${bullets(i.recommended_next_steps)}</div>` : ''}${tail}</article>`;
    }
    if (a.tool === 'create_internal_note') {
      return `<article class="${cls}"><div class="lhead"><span class="chan">Note</span><span class="who"><span>on the case file</span></span></div>
        <div class="body">${esc(i.text)}</div>${tail}</article>`;
    }
    return `<article class="${cls}"><div class="lhead"><span class="chan">No action</span><span class="who"><span>nothing sent</span></span></div>
      <div class="body">${esc(i.reason)}</div>${i.next_trigger ? `<p class="lfoot"><b>Next trigger:</b> ${esc(i.next_trigger)}</p>` : ''}${tail}</article>`;
  }
  function renderFile() {
    const c = CASES.find(x => x.id === state.sel);
    if (!c) { $('file').innerHTML = '<p class="empty">Pick a case from the list.</p>'; return; }
    const a = c.agent, ev = c.events, k = c.cut == null ? ev.length : c.cut, gold = c.cut == null ? null : ev[c.cut];
    const facts = [['Property', c.details.Property], ['Broker', c.details.Broker], ['Insurer', c.details.Insurer], ['Requester', c.details['Source role']]]
      .filter(f => f[1]).map(([t, v]) => `<div><dt>${t}</dt><dd>${esc(v)}</dd></div>`).join('');
    const cutline = gold
      ? `Agent saw <b>events 1–${k} of ${ev.length}</b>. ${k + 1 === ev.length ? `Event ${k + 1}` : `Events ${k + 1}–${ev.length}`} and the recorded outcome were hidden.`
      : `Agent saw the full history (<b>${ev.length} events</b>).`;
    const acts = a.actions.filter(x => x.status !== 'cancelled'), dropped = a.actions.filter(x => x.status === 'cancelled');
    const failed = a.decision === 'failed';
    let agentCol = `<section class="col agent"><h3>Agent decided</h3>
      <div class="verdict"><span class="pill" data-d="${esc(a.decision)}">${esc(DLABEL[a.decision] || a.decision)}</span>
        ${a.confidence != null ? `<span class="conf">confidence ${(+a.confidence).toFixed(2)}</span>` : ''}
        ${c.same != null ? `<span class="same" data-same="${c.same}">${c.same ? 'Same addressee as the broker' : 'Different addressee than the broker'}</span>` : ''}</div>`;
    if (failed) agentCol += `<p class="fail">The agent did not commit a decision: ${esc(a.error || a.stopped || 'run did not complete')}. In a real run this case falls back to a human handler.${acts.length ? ' Drafts it had staged are shown below for reference.' : ''}</p>`;
    if (a.situation) agentCol += `<p class="situation">${esc(a.situation)}</p>`;
    agentCol += `<div class="stack">${acts.map(actionLetter).join('')}</div>`;
    if (dropped.length) agentCol += `<details><summary>Withdrawn after the self-check (${dropped.length})</summary><div class="stack">${dropped.map(actionLetter).join('')}</div></details>`;
    agentCol += '</section>';

    let brokerCol = '';
    if (gold) {
      const later = ev.slice(c.cut + 1);
      brokerCol = `<section class="col"><h3>Broker actually did</h3>
        <div class="verdict"><span>Event ${gold.n}, addressed to ${esc(GOLD[c.gold_role] || 'another party')}</span></div>
        <div class="stack">${eventLetter(gold)}</div>
        ${later.length ? `<details><summary>What happened after (${later.length} later event${later.length > 1 ? 's' : ''})</summary><div class="stack">${later.map(eventLetter).join('')}</div></details>` : ''}
        <details><summary>Recorded outcome of the case</summary><div class="stack">
          ${c.next ? `<div class="sub"><h4>Next action at escalation</h4><p>${esc(c.next)}</p></div>` : ''}
          ${c.outcome ? `<div class="sub"><h4>Outcome</h4><p>${esc(c.outcome)}</p></div>` : ''}</div></details></section>`;
    }
    const atts = c.att.length ? `<div class="sub"><h4>Attachments</h4><div class="atts">${c.att.map(t => `<div class="att">
        ${t.src ? `<img src="${t.src}" alt="${esc(t.name)}" loading="lazy">` : ''}
        <span><span class="mono">${esc(t.name)}</span> · ${t.kb} KB · ${t.shown ? 'shown to the agent' : 'not shown to the agent'}${t.src ? '' : ' · preview not embedded'}</span></div>`).join('')}</div></div>` : '';
    const seen = `<section class="block"><h3>What the agent saw</h3>
      <ol class="timeline">${ev.slice(0, k).map(e => `<li><span class="num">${pad(e.n)}</span>${eventLetter(e)}</li>`).join('')}</ol>${atts}</section>`;
    const reason = failed && !a.rationale ? '' : `<section class="block"><h3>Agent's reasoning</h3><div class="reason">
        <div class="sub wide"><h4>Why this decision</h4><p>${esc(a.rationale) || '—'}</p></div>
        <div class="sub"><h4>Key facts it relied on</h4>${bullets(a.key_facts, 'None recorded.')}</div>
        <div class="sub"><h4>Conflicts, gaps and risks detected</h4>${bullets(a.issues, 'None detected.')}</div>
        <div class="sub"><h4>Options considered</h4>${bullets(a.options, 'None recorded.')}</div>
        <div class="sub"><h4>Open risks</h4>${bullets(a.open_risks, 'None recorded.')}</div></div></section>`;
    const calls = `<section class="block"><details><summary>Tool calls (${a.calls.length}) · ${a.turns || 0} model calls · ${(+a.duration || 0).toFixed(0)} s · $${(+a.cost || 0).toFixed(3)}</summary>
      <div class="scroll"><table><thead><tr><th>#</th><th>Tool</th><th>Input</th><th>Result</th></tr></thead><tbody>
      ${a.calls.map((x, i) => `<tr><td>${i + 1}</td><td>${esc(x.tool)}</td><td>${esc(x.input)}</td><td class="${x.err ? 'err' : ''}">${esc(x.result)}</td></tr>`).join('')}
      </tbody></table></div>
      ${a.notes.length ? `<div class="sub"><h4>Loader notes</h4>${bullets(a.notes)}</div>` : ''}</details></section>`;
    $('file').innerHTML = `<header class="fhead"><p class="eyebrow">Case ${esc(c.id)}${c.cat ? ' · ' + esc(c.cat) : ''}</p><h2>${esc(c.title)}</h2>
      <dl class="facts">${facts}</dl><p class="cutline">${cutline}</p></header>
      <div class="compare">${agentCol}${brokerCol}</div>${seen}${reason}${calls}`;
  }

  /* ---------- wiring ---------- */
  function select(id, scroll) {
    state.sel = id;
    try { history.replaceState(null, '', '#case-' + id); } catch (e) { /* hash is a convenience only */ }
    renderList(); renderFile();
    const cur = $('list').querySelector('[aria-current="true"]');
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest' });
    if (scroll && window.matchMedia('(max-width: 860px)').matches) $('file').scrollIntoView({ block: 'start' });
  }
  $('chips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    if (b.dataset.k === 'd') state.d = b.dataset.v; else state[b.dataset.k] = !state[b.dataset.k];
    renderChips(); renderList();
  });
  $('list').addEventListener('click', e => { const r = e.target.closest('.row'); if (r) select(r.dataset.id, true); });
  $('q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); renderList(); });
  document.addEventListener('keydown', e => {
    if (e.target.closest('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
    const step = (e.key === 'ArrowDown' || e.key === 'j') ? 1 : (e.key === 'ArrowUp' || e.key === 'k') ? -1 : 0;
    if (!step) return;
    const rows = CASES.filter(visible), i = rows.findIndex(c => c.id === state.sel), next = rows[Math.max(0, Math.min(rows.length - 1, i + step))];
    if (next) { e.preventDefault(); select(next.id, false); }
  });
  const fromHash = (location.hash.match(/^#case-(.+)$/) || [])[1];
  const first = CASES.find(c => c.id === fromHash) || CASES.find(c => c.same === false) || CASES[0];
  renderChips();
  if (first) select(first.id, false); else { renderList(); renderFile(); }
})();
</script>
