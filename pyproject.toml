[project]
name = "dwelly-ai-hackathon"
version = "0.1.0"
description = "Real-World Agents Hackathon submission"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "python-dotenv",
]

[project.scripts]
agent = "agent.cli:main"

[project.optional-dependencies]
voice = ["elevenlabs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
